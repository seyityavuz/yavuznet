name: Update YouTube Channels

on:
  schedule:
    - cron: '0 */2 * * *'   # Her 2 saatte bir çalışır
  workflow_dispatch:

jobs:
  update-channels:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        
    - name: Run noutube.py
      run: python noutube.py
      
    - name: Commit and push if changes
      env:
        PAT_TOKEN: ${{ secrets.PAT_TOKEN2 }}
      run: |
        git config --local user.email "seyityavuz@users.noreply.github.com"
        git config --local user.name "seyityavuz"
        git add -A
        git diff --quiet && git diff --staged --quiet || git commit -m "Update channel playlists [skip ci]"
        git push https://x-access-token:${PAT_TOKEN2}@github.com/seyityavuz/yavuznet.git main
